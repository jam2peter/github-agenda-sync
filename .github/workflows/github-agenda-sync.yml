name: GitHub Agenda Sync

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened]
  schedule:
    - cron: '15,45 * * * *'

concurrency:
  group: github-agenda-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect configuration
        id: config
        env:
          GH_AGENDA_GITHUB_TOKEN: ${{ secrets.GH_AGENDA_GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_AGENDA_REPOSITORIES: ${{ vars.GH_AGENDA_REPOSITORIES }}
        run: |
          missing=()
          for name in GH_AGENDA_GITHUB_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GH_AGENDA_REPOSITORIES; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GH_AGENDA_STATUS=NOT_CONFIGURED"
            printf 'Missing required configuration: %s\n' "${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GH_AGENDA_STATUS=CONFIGURED"
          fi

      - name: Report neutral unconfigured state
        if: steps.config.outputs.configured != 'true'
        run: |
          echo "GitHub Agenda Sync is installed but not configured."
          echo "Run ./github-agenda-sync setup to enable synchronization."
          echo "No Google or GitHub synchronization was attempted."

      - name: Sync GitHub Issues to Google
        if: steps.config.outputs.configured == 'true'
        env:
          GH_AGENDA_GITHUB_TOKEN: ${{ secrets.GH_AGENDA_GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_AGENDA_REPOSITORIES: ${{ vars.GH_AGENDA_REPOSITORIES }}
          GOOGLE_TASKLIST_ID: ${{ vars.GOOGLE_TASKLIST_ID || '@default' }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID || 'primary' }}
          GOOGLE_TIMEZONE: ${{ vars.GOOGLE_TIMEZONE || 'UTC' }}
          GOOGLE_EVENT_DEFAULT_MINUTES: ${{ vars.GOOGLE_EVENT_DEFAULT_MINUTES || '60' }}
        run: python3 src/github_agenda_sync.py
