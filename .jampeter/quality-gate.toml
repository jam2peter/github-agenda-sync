version = 1
profile = "github-agenda-sync-python"

[report]
path = ".quality-gate/report.json"

[[gate]]
id = "format"
phase = "format"
command = "ruff format --check src tests scripts"
required = false
safe_fix = "ruff format src tests scripts"

[[gate]]
id = "complexity"
phase = "clean"
command = "ruff check src tests scripts --select C90"
required = false

[[gate]]
id = "lint-critical"
phase = "lint"
command = "ruff check src tests scripts --select E9,F --ignore E402"
required = true

[[gate]]
id = "compile"
phase = "type"
command = "python3 -m compileall -q src tests scripts"
required = true

[[gate]]
id = "tests"
phase = "test"
command = "python3 -m unittest discover -s tests -v"
required = true
